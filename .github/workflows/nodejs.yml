name: Node.js CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional mocha --grep pattern; empty runs the full suite"
        required: false
        default: ""
        type: string

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write
      
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x, 25.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build --if-present
      - name: npm test
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            npm run clean && npx tsc && npx mocha --grep "$TEST_FILTER"
          else
            npm test
          fi

  pack:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 25.9.0
        uses: actions/setup-node@v6
        with:
          node-version: 25.9.0
      - run: npm ci
      - run: npm i -g npm@11.12.1
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: basic-ftp-tgz
          path: basic-ftp-5.3.1.tgz
          if-no-files-found: error
